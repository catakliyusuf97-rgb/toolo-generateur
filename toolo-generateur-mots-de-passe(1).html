<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolo - Générateur de mots de passe</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f7f7;margin:0;padding:40px;color:#203b48}
.container{max-width:650px;margin:auto;background:white;padding:30px;border-radius:18px;box-shadow:0 4px 20px #0001}
h1{text-align:center;color:#f5a623}
label{display:block;margin:18px 0 8px;font-weight:bold}
input[type=number],input[type=text]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:8px}
.check{margin:10px 0}
button{padding:12px 18px;border:0;border-radius:8px;background:#f5a623;color:white;font-size:16px;cursor:pointer;margin:8px 5px 0 0}
#result{margin-top:20px;font-size:20px;font-weight:bold;word-break:break-all;background:#f1f3f4;padding:15px;border-radius:8px}
</style>
</head>
<body>
<div class="container">
<h1>Générateur de mots de passe</h1>
<p>Créez gratuitement un mot de passe sécurisé en quelques secondes.</p>

<label for="length">Longueur : <span id="lengthValue">16</span></label>
<input id="length" type="number" min="8" max="32" value="16">

<div class="check"><input id="lower" type="checkbox" checked> Minuscules</div>
<div class="check"><input id="upper" type="checkbox" checked> Majuscules</div>
<div class="check"><input id="numbers" type="checkbox" checked> Chiffres</div>
<div class="check"><input id="symbols" type="checkbox" checked> Symboles</div>

<button onclick="generate()">Générer</button>
<button onclick="copyPassword()">Copier</button>

<div id="result">Cliquez sur « Générer »</div>
</div>

<script>
const lengthInput=document.getElementById("length");
lengthInput.addEventListener("input",()=>document.getElementById("lengthValue").textContent=lengthInput.value);

function generate(){
 let chars="";
 if(document.getElementById("lower").checked) chars+="abcdefghijklmnopqrstuvwxyz";
 if(document.getElementById("upper").checked) chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
 if(document.getElementById("numbers").checked) chars+="0123456789";
 if(document.getElementById("symbols").checked) chars+="!@#$%^&*()_+-=[]{}";
 if(!chars){document.getElementById("result").textContent="Choisissez au moins une option.";return;}
 let length=Math.min(32,Math.max(8,Number(lengthInput.value)));
 let password="";
 const array=new Uint32Array(length);
 crypto.getRandomValues(array);
 for(let i=0;i<length;i++) password+=chars[array[i]%chars.length];
 document.getElementById("result").textContent=password;
}
function copyPassword(){
 const text=document.getElementById("result").textContent;
 if(text && !text.startsWith("Cliquez") && !text.startsWith("Choisissez"))
 navigator.clipboard.writeText(text);
}
generate();
</script>
</body>
</html>
